<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container mt-5">

    <style>
      .logo-fondo {
        background-image: url('https://d3jwfft71tldss.cloudfront.net/uploads/b48b4253-6a33-4668-a40b-8a6148b12328/original/BMM-logo.svg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        height: 200px;
      }
    </style>

    <div class="logo-fondo mb-4"></div>

    <h2>Gestión de Clientes</h2>

    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="https://d3jwfft71tldss.cloudfront.net/uploads/b48b4253-6a33-4668-a40b-8a6148b12328/original/BMM-logo.svg" alt="Banco Mundo Mujer" width="60" height="60" class="d-inline-block align-text-top">
          Banco Mundo Mujer
        </a>
      </div>
    </nav>

    <!-- Formulario -->
    <div class="mb-3">
      <input type="text" id="nombre" placeholder="Nombre" class="form-control mb-2">
      <input type="email" id="correo" placeholder="Correo" class="form-control mb-2">
      <input type="text" id="ciudad" placeholder="Ciudad" class="form-control mb-2">
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
      <button class="btn btn-success ms-2" id="btnGenerarPDF">Descargar PDF</button>
    </div>

    <!-- Tabla -->
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Ciudad</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientes"></tbody>
    </table>

    <script>
      const clientes = [];
      let editando = false;
      let indiceEditar = null;

      function guardar() {
        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const ciudad = document.getElementById("ciudad").value;

        if (nombre && correo && ciudad) {
          if (editando) {
            clientes[indiceEditar] = { nombre, correo, ciudad };
            editando = false;
            indiceEditar = null;
          } else {
            clientes.push({ nombre, correo, ciudad });
          }

          mostrarClientes();
          limpiarFormulario();
        }
      }

      function mostrarClientes() {
        const tabla = document.getElementById("tablaClientes");
        tabla.innerHTML = "";
        clientes.forEach((cliente, index) => {
          tabla.innerHTML += `
            <tr>
              <td>${cliente.nombre}</td>
              <td>${cliente.correo}</td>
              <td>${cliente.ciudad}</td>
              <td>
                <button class="btn btn-warning btn-sm me-1" onclick="editar(${index})">Editar</button>
                <button class="btn btn-danger btn-sm" onclick="eliminar(${index})">Eliminar</button>
              </td>
            </tr>
          `;
        });
      }

      function editar(index) {
        const cliente = clientes[index];
        document.getElementById("nombre").value = cliente.nombre;
        document.getElementById("correo").value = cliente.correo;
        document.getElementById("ciudad").value = cliente.ciudad;
        editando = true;
        indiceEditar = index;
      }

      function eliminar(index) {
        clientes.splice(index, 1);
        mostrarClientes();
      }

      function limpiarFormulario() {
        document.getElementById("nombre").value = "";
        document.getElementById("correo").value = "";
        document.getElementById("ciudad").value = "";
      }

      // PDF
      window.onload = () => {
        const { jsPDF } = window.jspdf;

        document.getElementById("btnGenerarPDF").addEventListener("click", () => {
          const doc = new jsPDF();
          doc.setFontSize(16);
          doc.text("Listado de Clientes – Banco Mundo Mujer", 10, 20);

          let y = 30;
          clientes.forEach((cliente, i) => {
            doc.text(`${i + 1}. ${cliente.nombre} | ${cliente.correo} | ${cliente.ciudad}`, 10, y);
            y += 10;
          });

          doc.save("clientes.pdf");
        });
      };
    </script>
  </div>
</body>
</html>
